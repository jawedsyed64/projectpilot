name: Build Windows app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish (single .exe, no .NET install needed)
        run: >
          dotnet publish src/ProjectPilot/ProjectPilot.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ProjectPilot.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectPilot-Windows
          path: |
            installer/Output/ProjectPilot-Setup.exe
            publish/ProjectPilot.exe

      - name: Publish "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest installer/Output/ProjectPilot-Setup.exe publish/ProjectPilot.exe \
            --title "ProjectPilot — latest build" \
            --notes "Built automatically from commit ${{ github.sha }}. Download ProjectPilot-Setup.exe to install, or ProjectPilot.exe to run without installing."
